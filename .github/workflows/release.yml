name: Release

# A Version Tag Releases, A Manual Run Only Builds
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PUBLISH_DIRECTORY: WifiWatch.Desktop/bin/Release/net10.0-windows10.0.17763.0/win-x64/publish
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Exe
        run: dotnet publish WifiWatch.Desktop -c Release

      # SignPath Only Signs What GitHub Stored
      - name: Upload Unsigned Exe
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: ${{ env.PUBLISH_DIRECTORY }}/WifiWatch_v*.exe
          if-no-files-found: error

      - name: Read Version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Waits Up To An Hour For The Approval In SignPath
      - name: Sign Exe
        if: github.ref_type == 'tag' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WifiWatch
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.number) }}

      # The Updater Downloads WifiWatch_v<Version>.exe From The Tag
      - name: Create Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=$([ -d signed ] && echo signed || echo "$PUBLISH_DIRECTORY")
          gh release create "$GITHUB_REF_NAME" "$directory/WifiWatch_$GITHUB_REF_NAME.exe" --title "Wifi Watch $GITHUB_REF_NAME" --notes ""
