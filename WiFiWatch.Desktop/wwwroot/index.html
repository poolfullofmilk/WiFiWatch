<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <title>Wi-Fi Watch</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css"
          rel="stylesheet" />
    <link href="CSS/WiFiWatch.css"
          rel="stylesheet" />
</head>

<body>
    <div id="app"></div>
    <div id="blazor-error-ui">
        <span id="blazor-error-message">An Unhandled Error Has Occurred</span>
        <a href=""
           class="reload">
            Reload
        </a>
    </div>
    <script>
        // Cards Marked For It Answer Enter And Space Like Buttons
        document.addEventListener('keydown', (event) => {
            if ((event.key === 'Enter' || event.key === ' ') && event.target instanceof HTMLElement && event.target.hasAttribute('data-keyclick')) {
                event.preventDefault();
                event.target.click();
            }
        });

        window.wifiwatch = {
            setLanguage: (language, errorMessage, reloadLabel) => {
                document.documentElement.lang = language;
                document.getElementById('blazor-error-message').textContent = errorMessage;
                document.querySelector('#blazor-error-ui .reload').textContent = reloadLabel;
            }
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
